name: Feature request
description: Suggest an idea or improvement for FastPDF or its documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an improvement. Do not include documents, personal data, credentials, license keys, or other sensitive information."
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information
      description: Confirm that your request contains no sensitive information.
      options:
        - label: I have not included documents, personal data, credentials, license keys, or other sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of FastPDF does this concern?
      options:
        - Opening or viewing a document
        - Navigation or zoom
        - Search
        - Print
        - Convert (PDF to PNG, image to PDF)
        - Screenshot
        - Presentation mode
        - Page rotation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, without sensitive information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

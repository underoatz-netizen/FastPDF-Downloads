# Release metadata: PikaPDF v0.5.1 (2026-11-22)
# Installer SHA-256: 39d7e807a1292d080511be8a4ce9ea06922c9a5fe2f15e0687c290f66fee84da
# Portable SHA-256: 1b912854c6e833de6a71b6b6567f45760d3ea55438e00416ce51e2c0a49b0a6a
# SHA256SUMS SHA-256: a21a4bb017fff7ead3523f66c295fb6d5f5bda6d1ef0a5cc17647753cd7470d1
name: Feature request
description: Suggest an idea or improvement for PikaPDF (formerly FastPDF) or its documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an improvement. Do not include documents, personal data, credentials, license keys, or other sensitive information."
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information
      description: Confirm that your request contains no sensitive information.
      options:
        - label: I have not included documents, personal data, credentials, license keys, or other sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of PikaPDF (formerly FastPDF) does this concern?
      options:
        - Opening or viewing a document
        - Navigation or zoom
        - Search
        - Print
        - Convert (PDF to PNG, image to PDF)
        - Screenshot
        - Presentation mode
        - Page rotation
        - Sidebar (Thumbnails / Bookmarks)
        - Annotations (Draw / Highlight / Save a Copy)
        - Theme (System-Aware Light/Dark)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, without sensitive information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

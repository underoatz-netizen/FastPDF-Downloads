# Release metadata: PikaPDF v0.5.0 (2026-11-18)
# Installer SHA-256: 29c09b1347f2f20a96ad081425c22cda20d6880c5a076833090dddcd649ee1b9
# Portable SHA-256: 62494f6913657beaec8c33f7a81c710e041a1c1ee39390105203b6f561dc9dbb
# SHA256SUMS SHA-256: 0901f99ccfaa3910af77c9e0d272827737a4f696e15aed38b3909e01f0ae0710
name: Feature request
description: Suggest an idea or improvement for PikaPDF (formerly FastPDF) or its documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "Thanks for suggesting an improvement. Do not include documents, personal data, credentials, license keys, or other sensitive information."
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information
      description: Confirm that your request contains no sensitive information.
      options:
        - label: I have not included documents, personal data, credentials, license keys, or other sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of PikaPDF (formerly FastPDF) does this concern?
      options:
        - Opening or viewing a document
        - Navigation or zoom
        - Search
        - Print
        - Convert (PDF to PNG, image to PDF)
        - Screenshot
        - Presentation mode
        - Page rotation
        - Sidebar (Thumbnails / Bookmarks)
        - Annotations (Draw / Highlight / Save a Copy)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need, without sensitive information.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

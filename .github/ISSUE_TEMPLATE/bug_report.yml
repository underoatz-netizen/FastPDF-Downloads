# Release metadata: PikaPDF v0.5.0 (2026-11-18)
# Installer SHA-256: 29c09b1347f2f20a96ad081425c22cda20d6880c5a076833090dddcd649ee1b9
# Portable SHA-256: 62494f6913657beaec8c33f7a81c710e041a1c1ee39390105203b6f561dc9dbb
# SHA256SUMS SHA-256: 0901f99ccfaa3910af77c9e0d272827737a4f696e15aed38b3909e01f0ae0710
name: Bug report
description: Report a problem with PikaPDF (formerly FastPDF) or with this project's documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Do not include documents, personal data, credentials, license keys, or other sensitive information. A clear description with the exact steps is enough."
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information
      description: Confirm that your report contains no sensitive information.
      options:
        - label: I have not included documents, personal data, credentials, license keys, or other sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of PikaPDF (formerly FastPDF) does this concern?
      options:
        - Opening or viewing a document
        - Navigation or zoom
        - Search
        - Print
        - Convert (PDF to PNG, image to PDF)
        - Screenshot
        - Presentation mode
        - Page rotation
        - Sidebar (Thumbnails / Bookmarks)
        - Annotations (Draw / Highlight / Save a Copy)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, without sensitive information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that lead to the problem.
      placeholder: "1. Step one / 2. Step two / 3. Step three"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, without sensitive information.
    validations:
      required: false

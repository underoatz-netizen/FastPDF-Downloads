name: Bug report
description: Report a problem with FastPDF or with this project's documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Do not include documents, personal data, credentials, license keys, or other sensitive information. A clear description with the exact steps is enough."
  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive information
      description: Confirm that your report contains no sensitive information.
      options:
        - label: I have not included documents, personal data, credentials, license keys, or other sensitive information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of FastPDF does this concern?
      options:
        - Opening or viewing a document
        - Navigation or zoom
        - Search
        - Print
        - Convert (PDF to PNG, image to PDF)
        - Screenshot
        - Presentation mode
        - Page rotation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem, without sensitive information.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that lead to the problem.
      placeholder: "1. Step one / 2. Step two / 3. Step three"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, without sensitive information.
    validations:
      required: false
